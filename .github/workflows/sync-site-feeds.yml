# Copy to .github/workflows/sync-site-feeds.yml in thegreystone/searobots-league.
# Triggers the private feed-sync workflow whenever season configs or entries merge to main.
name: Request public site feed sync

on:
  push:
    branches: [main]
    paths:
      - 'open-league/**'
      - 'ai-league/**'

permissions: {}

concurrency:
  group: public-site-feed-sync
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch private site feed sync
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.LEAGUE_VALIDATOR_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'thegreystone',
              repo: 'searobots-league-impl',
              workflow_id: 'sync-site-feeds.yml',
              ref: 'main'
            });
